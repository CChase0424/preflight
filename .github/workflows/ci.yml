name: CI

on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - run: npm ci
      - run: npm run build --if-present
      # smoke test your scanner on a couple of zips
      - run: node src/cli.js scan test-apps/apps/swift-2048-master.zip --output out.json
      - run: node src/cli.js scan test-apps/apps/RaceMe-master.zip --output out2.json
      - uses: actions/upload-artifact@v4
        with: 
          name: preflight-reports
          path: |
            out.json
            out2.json
